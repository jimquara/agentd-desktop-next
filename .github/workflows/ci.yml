name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-vp installs Vite+ and the Node.js version in package.json `engines`;
# `vp install` then uses the pnpm version in `packageManager`.
jobs:
  check:
    name: Format, lint and i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      - name: Format
        run: vp run fmt:check
      - name: Lint
        run: vp run lint
      - name: Check i18n catalogs
        run: vp run i18n:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      - name: Typecheck
        run: vp run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The server tests ran the runner's 14 GB disk full; these preinstalled SDKs are unused here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # The desktop tests compile the browser secret helper against libsecret.
      - name: Install libsecret
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      # Web browser tests use playwright, server integration tests playwright-core.
      - name: Install Chromium
        run: |
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
          node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
      - name: Test
        # Every package's own test task; the root `test` script would recurse.
        run: vp run --filter '!@t3tools/monorepo' test
      - name: Disk left
        if: always()
        run: df -h /

  build_web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
      - name: Build web client
        run: vp run --filter @t3tools/web build
